<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="1; url=../">
    <title>KURONOMY - Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="image.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-bg" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    
    <!-- Black White Gold Theme Decorations -->
    <div class="gold-sparkle gold-sparkle-1" aria-hidden="true"></div>
    <div class="gold-sparkle gold-sparkle-2" aria-hidden="true"></div>
    <div class="gold-sparkle gold-sparkle-3" aria-hidden="true"></div>
    <div class="corner-decoration corner-tl" aria-hidden="true"></div>
    <div class="corner-decoration corner-tr" aria-hidden="true"></div>
    <div class="corner-decoration corner-bl" aria-hidden="true"></div>
    <div class="corner-decoration corner-br" aria-hidden="true"></div>

    <div class="loading-container">
        <div class="loading-content">
            <h1 class="loading-title">
                <span class="title-kuro">KURO</span>
                <span class="title-accent">NOMY</span>
            </h1>
            
            <div class="loading-animation">
                <div class="minecraft-block"></div>
                <div class="minecraft-block"></div>
                <div class="minecraft-block"></div>
            </div>
            
            <p class="loading-text">Loading...</p>
            <p class="loading-subtext"></p>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
